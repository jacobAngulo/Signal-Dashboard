# Add inside the private-plane server block, /etc/nginx/sites-enabled/10-private-workspace.
# The app serves its own static build, so everything proxies to :8010.
#
# Reachability is still over the admin WireGuard tunnel only, but that is no
# longer the whole story: as of the sign-in work the application checks a Google
# session itself (backend/auth.py). Two independent layers, either sufficient --
# which is what makes the public hostname in the plan possible at all.
#
# NOT YET PUBLIC. When this deployment gets its own hostname, this file is
# replaced by a whole server block modelled on
# /projects/industry-ops/deploy/nginx-site.conf, and this location block stays
# here as the VPN-only way back in when something about the public one breaks.

location = /signal-dashboard { return 301 /signal-dashboard/; }

location /signal-dashboard/ {
    proxy_pass http://127.0.0.1:8010/;
    proxy_http_version 1.1;

    # Required, not cosmetic. The trailing slash on proxy_pass strips the prefix
    # before the app ever sees it, so without this header the app believes it is
    # at the root and sends browsers to `/login` -- which on this host is the
    # catch-all `return 404`. It is also what makes the OAuth callback URL come
    # out as /signal-dashboard/api/auth/callback/google, the value registered on
    # the Google client. `ops_kit.web_auth.mount_prefix` discards anything here
    # that is not a plain absolute path.
    proxy_set_header X-Forwarded-Prefix /signal-dashboard;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
