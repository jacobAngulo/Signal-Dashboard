# Add inside the existing server block in /etc/nginx/sites-enabled/trading-bot-arena.
# The app serves its own static build, so everything proxies to :8010.

location = /signal-dashboard { return 301 /signal-dashboard/; }

location /signal-dashboard/ {
    proxy_pass http://127.0.0.1:8010/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
