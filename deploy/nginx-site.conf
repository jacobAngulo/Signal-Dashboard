# Signal Dashboard -- public server block.
#
# NOT INSTALLED YET. Goes to /etc/nginx/sites-{available,enabled}/30-public-signal-dashboard
# once signals.angulo-solutions.com resolves and a certificate exists. Until
# then the deployment answers only on the private plane via
# deploy/nginx-location.conf, which stays in place afterwards as the VPN-only
# way back in when something about this block breaks.
#
# Modelled on /projects/industry-ops/deploy/nginx-site.conf. The differences
# are the hostname, the certificate paths, the upstream port, and the
# /api/health carve-out below.
#
# Unlike Industry Ops, this deployment lets nobody in without a Google session
# on an allowlist -- signing up is not a thing it offers. Public reachability
# here means "the login page answers from anywhere", not "the data does".
#
# Depends on /etc/nginx/conf.d/rate-limits.conf for the web_general, web_auth,
# and sd_chart zones -- they must be declared at http{} scope, so they cannot
# live here.

server {
    listen 80;
    listen [::]:80;
    server_name signals.angulo-solutions.com;

    # Renewal is HTTP-01 webroot, so this must stay publicly reachable.
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        root /var/www/html;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    # `listen ... http2` rather than the `http2 on;` directive: this box runs
    # nginx 1.24, and the standalone directive did not arrive until 1.25.1.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name signals.angulo-solutions.com;

    ssl_certificate /etc/letsencrypt/live/signals.angulo-solutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signals.angulo-solutions.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;

    # The app takes no uploads at all -- every route is a GET except logout.
    client_max_body_size 16k;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # Scoped to this host only -- no includeSubDomains. The admin plane shares
    # the parent domain, and pinning HTTPS across every sibling name from one
    # app's response header is the parent's decision, not this block's.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    limit_req zone=web_general burst=60 nodelay;

    # Sign-in, callback, and session endpoints. Tighter zone, small burst.
    location ^~ /api/auth/ {
        limit_req zone=web_auth burst=8 nodelay;

        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Ticker charts fan out through av-gateway to Alpaca, so each request here
    # spends real upstream quota rather than local CPU. The gate already means
    # only allowlisted accounts reach it, but a signed-in tab in a reload loop
    # is a likelier cause of a surprise bill than an attacker is.
    location ^~ /api/ticker/ {
        limit_req zone=sd_chart burst=20 nodelay;

        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The manifest health probe hits this on loopback and must keep working;
    # it has no business answering the internet. The application leaves it in
    # auth.PUBLIC_PATHS for that loopback probe, so this is the second lock --
    # either one alone is sufficient.
    location ^~ /api/health { return 404; }

    # No X-Forwarded-Prefix here. This deployment answers at the root of its own
    # hostname, so the app builds https://signals.angulo-solutions.com/api/auth/
    # callback/google -- which must be registered on the Google client alongside
    # the prefixed private-plane callback.
    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
